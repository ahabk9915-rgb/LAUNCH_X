<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>X EARNING V2</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
body,html{height:100%;overflow:hidden}
.bg{position:fixed;width:100%;height:100%;
background:linear-gradient(-45deg,#ee7752,#e73c7e,#23a6d5,#23d5ab);
background-size:400% 400%;animation:gradient 15s ease infinite;z-index:-1}
@keyframes gradient{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.container{display:flex;justify-content:center;align-items:center;height:100%;padding:20px}
.box{background:rgba(255,255,255,0.15);padding:25px;border-radius:20px;
box-shadow:0 8px 32px 0 rgba(31,38,135,0.37);text-align:center;width:100%;max-width:400px;color:#fff;
border:1px solid rgba(255,255,255,0.18);backdrop-filter:blur(10px)}
input{width:100%;padding:12px;margin:8px 0;border:none;border-radius:10px;background:rgba(255,255,255,0.2);color:#fff}
input::placeholder{color:#eee}
.btn{width:100%;padding:12px;margin:8px 0;border:none;border-radius:10px;cursor:pointer;
background:#23a6d5;color:#fff;font-weight:bold;font-size:16px;transition:0.3s}
.btn:hover{background:#1c8ab3;transform:scale(1.03)}
.btn.green{background:#25D366}
.hidden{display:none}
</style>
</head>
<body>
<div class="bg"></div>
<div class="container">
  <!-- WELCOME PAGE -->
  <div class="box" id="welcome">
    <h1>Welcome to X EARNING ♾️</h1>
    <p>Earn money by completing simple tasks</p>
    <button class="btn" onclick="show('register')">1. Create Account</button>
    <button class="btn" onclick="show('login')">2. Login</button>
    <button class="btn green" onclick="window.open('https://wa.me/923316035482','_blank')">3. WhatsApp Support</button>
    <button class="btn" onclick="show('admin')">4. Admin Panel</button>
  </div>

  <!-- REGISTER PAGE -->
  <div class="box hidden" id="register">
    <h2>Create Account</h2>
    <input type="text" id="regName" placeholder="Full Name">
    <input type="email" id="regEmail" placeholder="Email">
    <input type="password" id="regPass" placeholder="Password">
    <button class="btn" onclick="register()">Register</button>
    <button class="btn" onclick="show('welcome')">Back</button>
  </div>

  <!-- LOGIN PAGE -->
  <div class="box hidden" id="login">
    <h2>Login</h2>
    <input type="email" id="logEmail" placeholder="Email">
    <input type="password" id="logPass" placeholder="Password">
    <button class="btn" onclick="login()">Login</button>
    <button class="btn" onclick="show('welcome')">Back</button>
  </div>

  <!-- DASHBOARD PAGE -->
  <div class="box hidden" id="dashboard">
    <h2>Welcome <span id="userName"></span></h2>
    <p>Your Balance: Rs. <span id="balance">0</span></p>
    <button class="btn" onclick="logout()">Logout</button>
  </div>

  <!-- ADMIN PAGE -->
  <div class="box hidden" id="admin">
    <h2>Admin Panel</h2>
    <div id="adminList"></div>
    <button class="btn" onclick="show('welcome')">Back</button>
  </div>
</div>

<script>
function show(id){
  document.querySelectorAll('.box').forEach(b=>b.classList.add('hidden'))
  document.getElementById(id).classList.remove('hidden')
  if(id=='admin') loadAdmin()
}

function register(){
  let users = JSON.parse(localStorage.getItem('users')) || []
  let user = {
    name: document.getElementById('regName').value,
    email: document.getElementById('regEmail').value,
    pass: document.getElementById('regPass').value,
    balance: 0
  }
  users.push(user)
  localStorage.setItem('users', JSON.stringify(users))
  alert('Account Created!')
  show('login')
}

function login(){
  let users = JSON.parse(localStorage.getItem('users')) || []
  let email = document.getElementById('logEmail').value
  let pass = document.getElementById('logPass').value
  let user = users.find(u=>u.email==email && u.pass==pass)
  if(user){
    localStorage.setItem('currentUser', JSON.stringify(user))
    document.getElementById('userName').innerText = user.name
    document.getElementById('balance').innerText = user.balance
    show('dashboard')
  }else{ alert('Invalid Email or Password') }
}

function logout(){
  localStorage.removeItem('currentUser')
  show('welcome')
}

function loadAdmin(){
  let users = JSON.parse(localStorage.getItem('users')) || []
  let html = ''
  users.forEach(u=>{
    html += `<p><b>${u.name}</b> - ${u.email} - Rs.${u.balance}</p>`
  })
  document.getElementById('adminList').innerHTML = html || 'No users yet'
}
</script>
</body>
</html>
