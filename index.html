<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Launch X</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { background: #0f172a; color: white; font-family: 'Inter', sans-serif; }
   .glass { background: rgba(30, 41, 59, 0.5); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
   .tab-active { background: #06b6d4!important; }
  </style>
</head>
<body class="min-h-screen">

  <!-- HEADER -->
  <div class="p-4 flex justify-between items-center">
    <h1 class="text-2xl font-bold text-cyan-400">Launch X</h1>
    <div class="flex gap-2">
      <button onclick="showAdmin()" class="px-4 py-2 bg-purple-600 rounded-lg">Admin Panel</button>
      <a href="https://wa.me/923316035482" target="_blank" class="px-4 py-2 bg-green-600 rounded-lg">WhatsApp</a>
    </div>
  </div>

  <!-- AUTH PAGE -->
  <div id="authPage" class="flex items-center justify-center p-4">
    <div class="glass rounded-2xl p-8 w-full max-w-md">
      <div class="flex gap-2 mb-6">
        <button onclick="showLogin()" id="loginTab" class="flex-1 py-2 rounded-lg bg-slate-700">Login</button>
        <button onclick="showRegister()" id="registerTab" class="flex-1 py-2 rounded-lg bg-slate-700 tab-active">Create Account</button>
      </div>

      <form id="registerForm" onsubmit="registerUser(event)">
        <input id="regName" type="text" placeholder="Full Name" required class="w-full p-3 mb-3 rounded-lg bg-slate-800">
        <input id="regEmail" type="email" placeholder="Email" required class="w-full p-3 mb-3 rounded-lg bg-slate-800">
        <input id="regNumber" type="text" placeholder="Phone Number" required class="w-full p-3 mb-3 rounded-lg bg-slate-800">
        <input id="regPass" type="password" placeholder="Password" required class="w-full p-3 mb-4 rounded-lg bg-slate-800">
        <button type="submit" class="w-full py-3 bg-cyan-600 rounded-lg font-bold">Submit</button>
      </form>

      <form id="loginForm" onsubmit="loginUser(event)" class="hidden">
        <input id="loginEmail" type="email" placeholder="Email" required class="w-full p-3 mb-3 rounded-lg bg-slate-800">
        <input id="loginPass" type="password" placeholder="Password" required class="w-full p-3 mb-4 rounded-lg bg-slate-800">
        <button type="submit" class="w-full py-3 bg-cyan-600 rounded-lg font-bold">Login</button>
      </form>
      <p id="authMessage" class="text-center mt-4 text-sm"></p>
    </div>
  </div>

  <!-- DEPOSIT PAGE -->
  <div id="depositPage" class="hidden p-4 max-w-md mx-auto">
    <div class="glass rounded-2xl p-6">
      <h2 class="text-xl font-bold mb-2">Entry Fee: 300 PKR</h2>
      <div class="bg-orange-500 p-4 rounded-lg text-center text-2xl font-bold mb-4">300 PKR</div>
      <p class="text-orange-400 mb-2">Easypaisa: 03368881011 - Abdul Rehan</p>
      
      <label class="text-sm">Transaction ID</label>
      <input id="depositTx" type="text" placeholder="Enter TX ID" required class="w-full p-3 mb-3 rounded-lg bg-slate-800">
      
      <button onclick="submitDeposit()" class="w-full py-3 bg-green-600 rounded-lg font-bold">I Have Deposited</button>
      <p id="depositMsg" class="text-center mt-3 text-yellow-400"></p>
      <button onclick="showDashboard()" class="w-full py-2 mt-3 bg-slate-700 rounded-lg">Back</button>
    </div>
  </div>

  <!-- DASHBOARD PAGE -->
  <div id="dashboardPage" class="hidden p-4 max-w-4xl mx-auto">
    <div class="flex justify-between items-center mb-6">
      <h1 class="text-2xl font-bold">Welcome, <span id="userName"></span></h1>
      <button onclick="logout()" class="px-4 py-2 bg-red-600 rounded-lg">Logout</button>
    </div>
    
    <div class="glass rounded-2xl p-6 mb-4 text-center">
      <p class="text-slate-400">Your Balance</p>
      <p class="text-4xl font-bold text-green-400">PKR <span id="userBalance">0</span></p>
    </div>

    <div class="grid grid-cols-2 gap-4">
      <button class="glass p-4 rounded-xl font-bold">Watch Video</button>
      <button class="glass p-4 rounded-xl font-bold">Invite Friend - 70 PKR</button>
      <button onclick="showDeposit()" class="glass p-4 rounded-xl font-bold">Add Funds 300 PKR</button>
      <button class="glass p-4 rounded-xl font-bold">Withdrawal 0.5$</button>
    </div>
  </div>

  <!-- ADMIN PANEL -->
  <div id="adminPage" class="hidden p-4 max-w-4xl mx-auto">
    <div class="flex justify-between items-center mb-6">
      <h1 class="text-2xl font-bold text-purple-400">Admin Panel</h1>
      <button onclick="showDashboard()" class="px-4 py-2 bg-slate-700 rounded-lg">Back</button>
    </div>
    <div id="pendingList" class="glass rounded-2xl p-6">
      <h2 class="text-xl mb-4">Pending Deposit Requests</h2>
      <div id="requestList">No Pending Requests</div>
    </div>
  </div>

<script>
  const SUPABASE_URL = 'https://bvgmcrqenrqtaedbaqav.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_4V777hQQNT5kYx6nCmR7Sw_vqH9B3QO';
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  let currentUser = null;

  // Load users from localStorage if not in supabase
  function getUsers() { return JSON.parse(localStorage.getItem('users')) || []; }
  function saveUsers(users) { localStorage.setItem('users', JSON.stringify(users)); }
  function getRequests() { return JSON.parse(localStorage.getItem('requests')) || []; }
  function saveRequests(reqs) { localStorage.setItem('requests', JSON.stringify(reqs)); }

  function showLogin() { toggleForms('login'); }
  function showRegister() { toggleForms('register'); }
  function toggleForms(active) {
    loginForm.classList.toggle('hidden', active!== 'login');
    registerForm.classList.toggle('hidden', active!== 'register');
    loginTab.classList.toggle('tab-active', active === 'login');
    registerTab.classList.toggle('tab-active', active === 'register');
  }

  async function registerUser(e) {
    e.preventDefault();
    let users = getUsers();
    users.push({name: regName.value, email: regEmail.value, number: regNumber.value, password: regPass.value, balance: 0});
    saveUsers(users);
    authMessage.innerText = 'Account Created! ✅ Now Login';
    authMessage.className = 'text-green-400';
    registerForm.reset();
  }

  async function loginUser(e) {
    e.preventDefault();
    let users = getUsers();
    let user = users.find(u => u.email === loginEmail.value && u.password === loginPass.value);
    if(user) { currentUser = user; showDashboard(); } 
    else { authMessage.innerText = 'Invalid Email or Password'; authMessage.className = 'text-red-400'; }
  }

  function showDashboard() {
    authPage.classList.add('hidden'); depositPage.classList.add('hidden'); adminPage.classList.add('hidden');
    dashboardPage.classList.remove('hidden');
    userName.innerText = currentUser.name; userBalance.innerText = currentUser.balance;
  }
  function showDeposit() {
    authPage.classList.add('hidden'); dashboardPage.classList.add('hidden'); adminPage.classList.add('hidden');
    depositPage.classList.remove('hidden'); depositMsg.innerText = '';
  }
  function logout() { currentUser = null; dashboardPage.classList.add('hidden'); depositPage.classList.add('hidden'); adminPage.classList.add('hidden'); authPage.classList.remove('hidden'); }

  function submitDeposit() {
    if(!depositTx.value) return alert('Enter Transaction ID');
    let reqs = getRequests();
    reqs.push({email: currentUser.email, name: currentUser.name, amount: 300, tx: depositTx.value, status: 'pending'});
    saveRequests(reqs);
    depositMsg.innerText = '✅ Request Sent - Waiting for Admin Approval';
    depositTx.value = '';
  }

  function showAdmin() {
    authPage.classList.add('hidden'); dashboardPage.classList.add('hidden'); depositPage.classList.add('hidden');
    adminPage.classList.remove('hidden');
    loadRequests();
  }

  function loadRequests() {
    let reqs = getRequests().filter(r => r.status === 'pending');
    let html = '';
    if(reqs.length === 0) html = 'No Pending Requests';
    reqs.forEach((r, i) => {
      html += `<div class="glass p-3 mb-3 rounded-lg">
        <p><b>Name:</b> ${r.name}</p>
        <p><b>Email:</b> ${r.email}</p>
        <p><b>Amount:</b> ${r.amount} PKR</p>
        <p><b>TX ID:</b> ${r.tx}</p>
        <button onclick="approve(${i})" class="mt-2 px-4 py-2 bg-green-600 rounded-lg">Approve</button>
      </div>`;
    });
    requestList.innerHTML = html;
  }

  function approve(index) {
    let reqs = getRequests();
    let req = reqs[index];
    
    // Add balance to user
    let users = getUsers();
    let user = users.find(u => u.email === req.email);
    if(user) user.balance += req.amount;
    saveUsers(users);

    // Remove request
    reqs.splice(index, 1);
    saveRequests(reqs);
    
    alert('Approved! Balance Added');
    loadRequests();
  }
</script>
</body>
</html>
