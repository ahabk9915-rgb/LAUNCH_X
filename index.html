<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Launch X</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { background: #0f172a; color: white; font-family: 'Inter', sans-serif; }
    .glass { background: rgba(30, 41, 59, 0.5); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
    .tab-active { background: #06b6d4 !important; }
  </style>
</head>
<body class="min-h-screen">

  <!-- HEADER -->
  <div class="p-4 flex justify-between items-center">
    <h1 class="text-2xl font-bold text-cyan-400">Launch X</h1>
    <a href="https://wa.me/923001234567" target="_blank" class="px-4 py-2 bg-green-600 rounded-lg">WhatsApp Support</a>
  </div>

  <!-- AUTH PAGE -->
  <div id="authPage" class="flex items-center justify-center p-4">
    <div class="glass rounded-2xl p-8 w-full max-w-md">
      <div class="flex gap-2 mb-6">
        <button onclick="showLogin()" id="loginTab" class="flex-1 py-2 rounded-lg bg-slate-700">Login</button>
        <button onclick="showRegister()" id="registerTab" class="flex-1 py-2 rounded-lg bg-slate-700 tab-active">Create Account</button>
      </div>

      <form id="registerForm" onsubmit="registerUser(event)">
        <input id="regName" type="text" placeholder="Full Name" required class="w-full p-3 mb-3 rounded-lg bg-slate-800 border-slate-700">
        <input id="regEmail" type="email" placeholder="Email" required class="w-full p-3 mb-3 rounded-lg bg-slate-800 border-slate-700">
        <input id="regNumber" type="text" placeholder="Phone Number" required class="w-full p-3 mb-3 rounded-lg bg-slate-800 border-slate-700">
        <input id="regPass" type="password" placeholder="Password" required class="w-full p-3 mb-4 rounded-lg bg-slate-800 border-slate-700">
        <button type="submit" class="w-full py-3 bg-cyan-600 rounded-lg font-bold">Submit</button>
      </form>

      <form id="loginForm" onsubmit="loginUser(event)" class="hidden">
        <input id="loginEmail" type="email" placeholder="Email" required class="w-full p-3 mb-3 rounded-lg bg-slate-800 border-slate-700">
        <input id="loginPass" type="password" placeholder="Password" required class="w-full p-3 mb-4 rounded-lg bg-slate-800 border-slate-700">
        <button type="submit" class="w-full py-3 bg-cyan-600 rounded-lg font-bold">Login</button>
      </form>
      
      <button onclick="alert('Admin Login Coming Soon')" class="w-full py-3 mt-3 bg-purple-600 rounded-lg font-bold">Admin Panel</button>
      <p id="authMessage" class="text-center mt-4 text-sm"></p>
    </div>
  </div>

  <!-- DEPOSIT PAGE -->
  <div id="depositPage" class="hidden p-4 max-w-md mx-auto">
    <div class="glass rounded-2xl p-6">
      <h2 class="text-xl font-bold mb-4">Deposit $300</h2>
      <p class="mb-2">Send to: <span class="text-cyan-400">Abdul Reham</span></p>
      <p class="mb-4">WhatsApp: <span class="text-green-400">923001234567</span></p>
      <form onsubmit="submitDeposit(event)">
        <input id="depositAmount" type="number" value="300" readonly class="w-full p-3 mb-3 rounded-lg bg-slate-800">
        <input id="depositTx" type="text" placeholder="Transaction ID" required class="w-full p-3 mb-3 rounded-lg bg-slate-800">
        <button type="submit" class="w-full py-3 bg-green-600 rounded-lg font-bold">Submit Request</button>
      </form>
      <button onclick="showDashboard()" class="w-full py-2 mt-3 bg-slate-700 rounded-lg">Back</button>
    </div>
  </div>

  <!-- DASHBOARD PAGE -->
  <div id="dashboardPage" class="hidden p-4 max-w-4xl mx-auto">
    <div class="flex justify-between items-center mb-6">
      <h1 class="text-2xl font-bold">Welcome, <span id="userName"></span></h1>
      <button onclick="logout()" class="px-4 py-2 bg-red-600 rounded-lg">Logout</button>
    </div>
    
    <div class="glass rounded-2xl p-6 mb-4 text-center">
      <p class="text-slate-400">Your Balance</p>
      <p class="text-4xl font-bold text-green-400">$<span id="userBalance">0</span></p>
    </div>

    <div class="grid grid-cols-2 gap-4">
      <button onclick="alert('Watch Video - Coming Soon')" class="glass p-4 rounded-xl font-bold">Watch Video</button>
      <button onclick="alert('Invite Friend - You Earn 70 PKR per friend')" class="glass p-4 rounded-xl font-bold">Invite Friend</button>
      <button onclick="showDeposit()" class="glass p-4 rounded-xl font-bold">Add Funds</button>
      <button onclick="alert('Min Withdrawal: 0.5$ - Coming Soon')" class="glass p-4 rounded-xl font-bold">Withdrawal</button>
      <button onclick="alert('Add Earn - Coming Soon')" class="glass p-4 rounded-xl font-bold">Add Earn</button>
      <button onclick="alert('Complete Task - Coming Soon')" class="glass p-4 rounded-xl font-bold">Complete Task</button>
    </div>
  </div>

<script>
  const SUPABASE_URL = 'https://bvgmcrqenrqtaedbaqav.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_4V777hQQNT5kYx6nCmR7Sw_vqH9B3QO';
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  let currentUser = null;

  function showLogin() { toggleForms('login'); }
  function showRegister() { toggleForms('register'); }
  function toggleForms(active) {
    document.getElementById('loginForm').classList.toggle('hidden', active !== 'login');
    document.getElementById('registerForm').classList.toggle('hidden', active !== 'register');
    document.getElementById('loginTab').classList.toggle('tab-active', active === 'login');
    document.getElementById('registerTab').classList.toggle('tab-active', active === 'register');
  }

  async function registerUser(e) {
    e.preventDefault();
    const { error } = await supabase.from('users').insert([{
      name: regName.value, email: regEmail.value, number: regNumber.value, password: regPass.value, balance: 0
    }]);
    authMessage.innerText = error ? 'Error: '+error.message : 'Account Created! ✅ Now Login';
  }

  async function loginUser(e) {
    e.preventDefault();
    const { data } = await supabase.from('users').select('*').eq('email', loginEmail.value).eq('password', loginPass.value).single();
    if(data) { currentUser = data; showDashboard(); } 
    else { authMessage.innerText = 'Invalid Email or Password'; }
  }

  function showDashboard() {
    authPage.classList.add('hidden'); depositPage.classList.add('hidden');
    dashboardPage.classList.remove('hidden');
    userName.innerText = currentUser.name; userBalance.innerText = currentUser.balance;
  }
  function showDeposit() {
    authPage.classList.add('hidden'); dashboardPage.classList.add('hidden');
    depositPage.classList.remove('hidden');
  }
  function logout() { currentUser = null; dashboardPage.classList.add('hidden'); depositPage.classList.add('hidden'); authPage.classList.remove('hidden'); }

  async function submitDeposit(e) {
    e.preventDefault();
    await supabase.from('pending_deposits').insert([{
      user_email: currentUser.email, amount: depositAmount.value, tx_id: depositTx.value, status: 'pending'
    }]);
    alert('Request Submitted! Admin will approve soon.');
    showDashboard();
  }
</script>
</body>
</html>
