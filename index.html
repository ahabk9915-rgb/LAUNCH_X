<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Launch X</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: #0f172a; color: white; font-family: 'Inter', sans-serif; }
.glass { background: rgba(30, 41, 59, 0.5); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
.tab-active { background: #06b6d4!important; }
table { width: 100%; border-collapse: collapse; }
th, td { padding: 10px; border: 1px solid #334155; text-align: left; font-size: 12px; }
th { background: #1e293b; }
  </style>
</head>
<body class="min-h-screen">

  <!-- HEADER -->
  <div class="p-4 flex justify-between items-center">
    <h1 class="text-2xl font-bold text-cyan-400">🚀 Launch X</h1>
    <button onclick="showAdminLogin()" class="px-4 py-2 bg-purple-600 rounded-lg">Admin Panel</button>
  </div>

  <!-- ADMIN PANEL - WITH DATA SHEET -->
  <div id="adminPage" class="hidden p-4 max-w-7xl mx-auto">
    <div class="flex justify-between items-center mb-6">
      <h1 class="text-2xl font-bold text-purple-400">Admin Panel</h1>
      <button onclick="adminLogout()" class="px-4 py-2 bg-red-600 rounded-lg">Admin Logout</button>
    </div>

    <!-- DATA SHEET TABLE -->
    <div class="glass rounded-2xl p-6 mb-4">
      <h2 class="text-xl mb-3">📊 All Users Data Sheet</h2>
      <div class="overflow-x-auto">
        <table id="usersTable">
          <thead>
            <tr>
              <th>#</th>
              <th>Name</th>
              <th>Email</th>
              <th>Number</th>
              <th>Balance $</th>
              <th>Active</th>
              <th>Referred By</th>
              <th>Refer Count</th>
              <th>Refer Earned $</th>
            </tr>
          </thead>
          <tbody id="usersTableBody">
          </tbody>
        </table>
      </div>
      <button onclick="exportCSV()" class="mt-3 px-4 py-2 bg-green-600 rounded-lg">📥 Export CSV</button>
    </div>

    <!-- YOUTUBE LINK SETTINGS -->
    <div class="glass rounded-2xl p-6 mb-4">
      <h2 class="text-xl mb-3">YouTube Link Settings</h2>
      <input id="ytLink" type="text" value="https://youtube.com/shorts/PNsbWwa3Kwo?si=o_nJdsPS6TfjUEMh" class="w-full p-3 mb-3 rounded-lg bg-slate-800">
      <button onclick="saveYT()" class="px-4 py-2 bg-green-600 rounded-lg">Save Link</button>
    </div>

    <!-- PENDING REQUESTS -->
    <div class="glass rounded-2xl p-6">
      <h2 class="text-xl mb-3">Pending Deposit Requests</h2>
      <div id="pendingList">No Pending Requests</div>
    </div>
  </div>

<script>
  let currentUser = null;
  let isAdmin = false;
  const ADMIN_EMAIL = "admin@launchx.com";
  const ADMIN_PASS = "admin123";
  const REFERRAL_BONUS = 0.24;

  function getUsers() { return JSON.parse(localStorage.getItem('users')) || []; }
  function saveUsers(users) { localStorage.setItem('users', JSON.stringify(users)); }
  function getRequests() { return JSON.parse(localStorage.getItem('requests')) || []; }
  function saveRequests(reqs) { localStorage.setItem('requests', JSON.stringify(reqs)); }

  // ADMIN PANEL - WITH DATA SHEET
  function showAdminPanel() {
    adminLoginPage.classList.add('hidden');
    adminPage.classList.remove('hidden');
    loadUsersTable(); // Load Data Sheet
    loadRequests();
  }

  // NEW: LOAD USERS IN TABLE
  function loadUsersTable() {
    let users = getUsers();
    let tbody = document.getElementById('usersTableBody');
    tbody.innerHTML = '';
    users.forEach((u, i) => {
      tbody.innerHTML += `<tr>
        <td>${i+1}</td>
        <td>${u.name}</td>
        <td>${u.email}</td>
        <td>${u.number || '-'}</td>
        <td>$${u.balance.toFixed(2)}</td>
        <td>${u.active? '✅ Yes' : '❌ No'}</td>
        <td>${u.referredBy || '-'}</td>
        <td>${u.referCount || 0}</td>
        <td>$${(u.referEarned || 0).toFixed(2)}</td>
      </tr>`;
    });
  }

  // NEW: EXPORT CSV
  function exportCSV() {
    let users = getUsers();
    let csv = 'Name,Email,Number,Balance,Active,ReferredBy,ReferCount,ReferEarned\n';
    users.forEach(u => {
      csv += `${u.name},${u.email},${u.number},${u.balance},${u.active},${u.referredBy},${u.referCount},${u.referEarned}\n`;
    });
    let blob = new Blob([csv], { type: 'text/csv' });
    let url = URL.createObjectURL(blob);
    let a = document.createElement('a');
    a.href = url;
    a.download = 'launchx_users.csv';
    a.click();
  }

  function approveDeposit(index) {
    let reqs = getRequests();
    let req = reqs[index];
    let users = getUsers();
    let user = users.find(u => u.email === req.email);
    if(user) {
      user.active = true;
      if(user.referredBy) {
        let refUser = users.find(u => u.email === user.referredBy);
        if(refUser) {
          refUser.referCount += 1;
          refUser.referEarned += REFERRAL_BONUS;
          refUser.balance += REFERRAL_BONUS;
        }
      }
      saveUsers(users);
      loadUsersTable(); // Refresh Table
    }
    reqs.splice(index, 1);
    saveRequests(reqs);
    alert(`✅ User Activated! Referral Bonus $${REFERRAL_BONUS} Given`);
    loadRequests();
  }

  // باقی سارا کوڈ وہی رہے گا جو پچھلا تھا...
  // Login, Register, Deposit, Task, Video, Withdraw...
</script>
</body>
</html>
