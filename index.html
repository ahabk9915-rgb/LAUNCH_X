<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Launch X</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: #0f172a; color: white; font-family: 'Inter', sans-serif; }
  .glass { background: rgba(30, 41, 59, 0.5); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
  .tab-active { background: #06b6d4!important; }
  .pic-box { width: 80px; height: 80px; background: #334155; display: flex; align-items: center; justify-content: center; border-radius: 8px; cursor: pointer; }
  .pic-box.rated { border: 2px solid #22c55e; }
  </style>
</head>
<body class="min-h-screen">

  <!-- HEADER -->
  <div class="p-4 flex justify-between items-center">
    <h1 class="text-2xl font-bold text-cyan-400">Launch X</h1>
    <div class="flex gap-2">
      <button onclick="showAdmin()" class="px-4 py-2 bg-purple-600 rounded-lg">Admin Panel</button>
      <a href="https://wa.me/923316035482" target="_blank" class="px-4 py-2 bg-green-600 rounded-lg">WhatsApp</a>
    </div>
  </div>

  <!-- AUTH PAGE -->
  <div id="authPage" class="flex items-center justify-center p-4">
    <div class="glass rounded-2xl p-8 w-full max-w-md">
      <div class="flex gap-2 mb-6">
        <button type="button" onclick="showLogin()" id="loginTab" class="flex-1 py-2 rounded-lg bg-slate-700">Login</button>
        <button type="button" onclick="showRegister()" id="registerTab" class="flex-1 py-2 rounded-lg bg-slate-700 tab-active">Create Account</button>
      </div>

      <div id="registerForm">
        <input id="regName" type="text" placeholder="Full Name" class="w-full p-3 mb-3 rounded-lg bg-slate-800">
        <input id="regEmail" type="email" placeholder="Email" class="w-full p-3 mb-3 rounded-lg bg-slate-800">
        <input id="regNumber" type="text" placeholder="Phone Number" class="w-full p-3 mb-3 rounded-lg bg-slate-800">
        <input id="regPass" type="password" placeholder="Password" class="w-full p-3 mb-4 rounded-lg bg-slate-800">
        <button type="button" onclick="registerUser()" class="w-full py-3 bg-cyan-600 rounded-lg font-bold">Submit</button>
      </div>

      <div id="loginForm" class="hidden">
        <input id="loginEmail" type="email" placeholder="Email" class="w-full p-3 mb-3 rounded-lg bg-slate-800">
        <input id="loginPass" type="password" placeholder="Password" class="w-full p-3 mb-4 rounded-lg bg-slate-800">
        <button type="button" onclick="loginUser()" class="w-full py-3 bg-cyan-600 rounded-lg font-bold">Login</button>
      </div>
      <p id="authMessage" class="text-center mt-4 text-sm"></p>
    </div>
  </div>

  <!-- DASHBOARD PAGE -->
  <div id="dashboardPage" class="hidden p-4 max-w-4xl mx-auto">
    <div class="flex justify-between items-center mb-6">
      <h1 class="text-2xl font-bold">Welcome, <span id="userName"></span></h1>
      <button onclick="logout()" class="px-4 py-2 bg-red-600 rounded-lg">Logout</button>
    </div>
    
    <div class="glass rounded-2xl p-6 mb-4 text-center">
      <p class="text-slate-400">Your Balance</p>
      <p class="text-4xl font-bold text-green-400">$<span id="userBalance">0.00</span></p>
    </div>

    <div class="grid grid-cols-2 gap-4">
      <button onclick="alert('Coming Soon')" class="glass p-4 rounded-xl font-bold bg-yellow-600">ADD EARN</button>
      <button onclick="showTask()" class="glass p-4 rounded-xl font-bold bg-blue-600">COMPLETE TASK</button>
      <button onclick="showVideo()" class="glass p-4 rounded-xl font-bold bg-green-600">WATCH VIDEO</button>
      <button onclick="alert('Invite Link: launchx.app/ref='+currentUser.email)" class="glass p-4 rounded-xl font-bold bg-purple-600">INVITE FRIEND</button>
      <button onclick="showWithdraw()" class="glass p-4 rounded-xl font-bold bg-red-600 col-span-2">WITHDRAW</button>
    </div>
  </div>

  <!-- TASK PAGE -->
  <div id="taskPage" class="hidden p-4 max-w-md mx-auto">
    <div class="glass rounded-2xl p-6">
      <h2 class="text-xl font-bold mb-2">Daily Task - Rate 10 Pics</h2>
      <p class="text-sm mb-4">1 Pic = $0.001 | Total 10 Pics = $0.01</p>
      <div id="picGrid" class="grid grid-cols-5 gap-2 mb-4"></div>
      <button id="claimBtn" onclick="claimTask()" class="w-full py-3 bg-green-600 rounded-lg font-bold">Claim $0.01</button>
      <button onclick="showDashboard()" class="w-full py-2 mt-3 bg-slate-700 rounded-lg">Back</button>
      <p id="taskMsg" class="text-center mt-3 text-yellow-400"></p>
    </div>
  </div>

  <!-- VIDEO PAGE -->
  <div id="videoPage" class="hidden p-4 max-w-md mx-auto">
    <div class="glass rounded-2xl p-6">
      <h2 class="text-xl font-bold mb-2">Watch Video & Subscribe</h2>
      <p class="text-sm mb-4">Hamara YouTube Channel Subscribe karen aur $0.10 earn karen</p>
      <button onclick="window.open('https://youtube.com', '_blank')" class="w-full py-3 bg-red-600 rounded-lg font-bold mb-3">Go To YouTube</button>
      <button onclick="claimVideo()" class="w-full py-3 bg-green-600 rounded-lg font-bold mb-3">I Subscribed - Claim $0.10</button>
      <button onclick="showDashboard()" class="w-full py-2 bg-slate-700 rounded-lg">Back</button>
      <p id="videoMsg" class="text-center mt-3 text-yellow-400"></p>
    </div>
  </div>

  <!-- WITHDRAW PAGE -->
  <div id="withdrawPage" class="hidden p-4 max-w-md mx-auto">
    <div class="glass rounded-2xl p-6">
      <h2 class="text-xl font-bold mb-2">Withdraw</h2>
      <p class="text-sm mb-4">Minimum Withdraw: $0.5</p>
      <input id="withdrawNum" type="text" placeholder="Easypaisa Number" value="03316035482" class="w-full p-3 mb-3 rounded-lg bg-slate-800">
      <input id="withdrawAmount" type="number" placeholder="Amount $" class="w-full p-3 mb-3 rounded-lg bg-slate-800">
      <button onclick="requestWithdraw()" class="w-full py-3 bg-red-600 rounded-lg font-bold mb-3">Request Withdraw</button>
      <button onclick="showDashboard()" class="w-full py-2 bg-slate-700 rounded-lg">Back</button>
    </div>
  </div>

<script>
  let currentUser = null;

  function getUsers() { return JSON.parse(localStorage.getItem('users')) || []; }
  function saveUsers(users) { localStorage.setItem('users', JSON.stringify(users)); }
  function getData(key) { return JSON.parse(localStorage.getItem(key)) || {}; }
  function saveData(key, data) { localStorage.setItem(key, JSON.stringify(data)); }

  function showLogin() { loginForm.classList.remove('hidden'); registerForm.classList.add('hidden'); loginTab.classList.add('tab-active'); registerTab.classList.remove('tab-active'); }
  function showRegister() { registerForm.classList.remove('hidden'); loginForm.classList.add('hidden'); registerTab.classList.add('tab-active'); loginTab.classList.remove('tab-active'); }

  function registerUser() {
    let users = getUsers();
    if(!regName.value ||!regEmail.value ||!regPass.value) { authMessage.innerText = 'Please fill all fields'; authMessage.className = 'text-red-400'; return; }
    users.push({name: regName.value, email: regEmail.value, number: regNumber.value, password: regPass.value, balance: 0.00}); // ZERO BALANCE
    saveUsers(users);
    authMessage.innerText = 'Account Created! ✅ Now Login'; authMessage.className = 'text-green-400';
  }

  function loginUser() {
    let users = getUsers();
    let user = users.find(u => u.email === loginEmail.value && u.password === loginPass.value);
    if(user) { currentUser = user; showDashboard(); } 
    else { authMessage.innerText = 'Invalid Email or Password'; authMessage.className = 'text-red-400'; }
  }

  function showDashboard() {
    authPage.classList.add('hidden'); taskPage.classList.add('hidden'); videoPage.classList.add('hidden'); withdrawPage.classList.add('hidden');
    dashboardPage.classList.remove('hidden');
    userName.innerText = currentUser.name; userBalance.innerText = currentUser.balance.toFixed(2);
  }
  function logout() { currentUser = null; dashboardPage.classList.add('hidden'); authPage.classList.remove('hidden'); }

  // TASK LOGIC
  function showTask() {
    dashboardPage.classList.add('hidden'); taskPage.classList.remove('hidden');
    let today = new Date().toDateString();
    let claims = getData('taskClaims');
    if(claims[currentUser.email] === today) {
      taskMsg.innerText = '⚠️ You already claimed today. Come back tomorrow.';
      claimBtn.disabled = true; claimBtn.classList.add('opacity-50');
    } else { taskMsg.innerText = ''; claimBtn.disabled = false; claimBtn.classList.remove('opacity-50'); }
    
    picGrid.innerHTML = '';
    for(let i=1; i<=10; i++) {
      picGrid.innerHTML += `<div class="pic-box" onclick="this.classList.toggle('rated')">${i}</div>`;
    }
  }

  function claimTask() {
    let rated = document.querySelectorAll('.pic-box.rated').length;
    if(rated < 10) return alert('Please rate all 10 pictures');
    
    let users = getUsers();
    let user = users.find(u => u.email === currentUser.email);
    user.balance += 0.01;
    saveUsers(users);
    
    let claims = getData('taskClaims');
    claims[currentUser.email] = new Date().toDateString();
    saveData('taskClaims', claims);
    
    alert('✅ $0.01 Added!');
    showDashboard();
  }

  // VIDEO LOGIC
  function showVideo() { dashboardPage.classList.add('hidden'); videoPage.classList.remove('hidden'); videoMsg.innerText = ''; }
  function claimVideo() {
    let claims = getData('videoClaims');
    let today = new Date().toDateString();
    if(claims[currentUser.email] === today) return videoMsg.innerText = '⚠️ Already claimed today';
    
    let users = getUsers();
    let user = users.find(u => u.email === currentUser.email);
    user.balance += 0.10;
    saveUsers(users);
    
    claims[currentUser.email] = today;
    saveData('videoClaims', claims);
    videoMsg.innerText = '✅ $0.10 Added!';
  }

  // WITHDRAW
  function showWithdraw() { dashboardPage.classList.add('hidden'); withdrawPage.classList.remove('hidden'); }
  function requestWithdraw() {
    if(withdrawAmount.value < 0.5) return alert('Minimum $0.5');
    alert('Withdraw Request Sent to Admin');
    withdrawAmount.value = '';
  }
</script>
</body>
</html>
